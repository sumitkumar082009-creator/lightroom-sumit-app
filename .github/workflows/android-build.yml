name: Android CI - Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '11'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK tools
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          install-gradle: false

      - name: Accept Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      # If you want a debug APK (unsigned)
      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # If you want release APK (may require keystore)
      #- name: Assemble Release APK
      #  env:
      #    KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}   # optional: add keystore as base64 secret
      #    KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      #    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      #    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      #  run: |
      #    if [ -n "$KEYSTORE_BASE64" ]; then
      #      echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore.jks
      #    fi
      #    ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: |
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.aab
